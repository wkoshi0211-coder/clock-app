<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>うごかす とけい</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:"Arial Rounded MT Bold","Hiragino Maru Gothic ProN",Arial,sans-serif}main{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center;padding:10px}svg{display:block;width:min(96vw,96vh);width:min(96vw,96dvh);height:auto;max-height:100%;touch-action:none;user-select:none;-webkit-user-select:none}#minute{cursor:grab;outline:none}#minute:active{cursor:grabbing}#hit{fill:transparent;stroke:transparent;stroke-width:48;pointer-events:all}#minute:focus-visible #hand{stroke:#168ac2;stroke-width:5}</style></head>
<body><main><svg id="clock" viewBox="0 0 800 800" role="group" aria-label="長針を動かすと短針も動く時計">
<circle cx="400" cy="400" r="388" fill="white" stroke="#707173" stroke-width="3.5"/>
<circle cx="400" cy="400" r="364" fill="none" stroke="#707173" stroke-width="3.5"/>
<g id="marks" stroke="#707173"></g><g id="numbers" fill="#707173" text-anchor="middle" dominant-baseline="central" font-size="78"></g>
<g id="hour"><path d="M383 400 L383 213 L400 193 L417 213 L417 400 Z" fill="#bf7158" stroke="#292525" stroke-width="2.8" stroke-linejoin="round"/></g>
<g id="minute" role="slider" tabindex="0" aria-label="長針。矢印キーで1分ずつ動かせます" aria-valuemin="0" aria-valuemax="719"><path id="hand" d="M385 400 L400 43 L415 400 Z" fill="#005982" stroke="#292525" stroke-width="2.5" stroke-linejoin="round"/><path id="hit" d="M385 400 L400 43 L415 400 Z"/></g>
<circle cx="400" cy="400" r="12" fill="white" stroke="#292525" stroke-width="2.5" pointer-events="none"/></svg></main>
<script>
'use strict';
const svg=document.getElementById('clock'),minute=document.getElementById('minute'),hour=document.getElementById('hour'),ns='http://www.w3.org/2000/svg';
for(let i=0;i<60;i++){const a=i*Math.PI/30,major=i%5===0,line=document.createElementNS(ns,'line'),inner=major?346:349;line.setAttribute('x1',400+Math.sin(a)*inner);line.setAttribute('y1',400-Math.cos(a)*inner);line.setAttribute('x2',400+Math.sin(a)*364);line.setAttribute('y2',400-Math.cos(a)*364);line.setAttribute('stroke-width',major?7:2.5);document.getElementById('marks').append(line)}
for(let i=1;i<=12;i++){const a=i*Math.PI/6,t=document.createElementNS(ns,'text');t.setAttribute('x',400+Math.sin(a)*313);t.setAttribute('y',400-Math.cos(a)*313);t.textContent=i;document.getElementById('numbers').append(t)}
let total=600,active=null,previous=0;
function render(){const value=((Math.round(total)%720)+720)%720;minute.setAttribute('transform','rotate('+total*6+' 400 400)');hour.setAttribute('transform','rotate('+total*.5+' 400 400)');minute.setAttribute('aria-valuenow',value);minute.setAttribute('aria-valuetext',(Math.floor(value/60)||12)+'時'+value%60+'分')}
function angle(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());if(Math.hypot(q.x-400,q.y-400)<35)return null;return Math.atan2(q.x-400,400-q.y)*180/Math.PI}
minute.addEventListener('pointerdown',e=>{if(active!==null||e.button!==0)return;const a=angle(e);if(a===null)return;e.preventDefault();active=e.pointerId;previous=a;minute.setPointerCapture(active)});
minute.addEventListener('pointermove',e=>{if(e.pointerId!==active)return;const a=angle(e);if(a===null)return;const delta=((a-previous+540)%360)-180;total+=delta/6;previous=a;render()});
function finish(e){if(e.pointerId!==active)return;active=null;total=Math.round(total);render()}
minute.addEventListener('pointerup',finish);minute.addEventListener('pointercancel',finish);minute.addEventListener('lostpointercapture',finish);
minute.addEventListener('keydown',e=>{const steps={ArrowRight:1,ArrowUp:1,ArrowLeft:-1,ArrowDown:-1};if(e.key in steps){e.preventDefault();total=Math.round(total)+steps[e.key];render()}});render();
</script></body></html>
